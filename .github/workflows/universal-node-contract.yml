name: universal-node-contract
on:
  pull_request:
    paths:
      - 'src/provisioning.rs'
      - 'src/universal_transport_config.rs'
      - 'tools/portable/**'
      - '.github/workflows/universal-node-contract.yml'
  push:
    branches:
      - 'chatbox/universal-node-permanent'
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Bootstrap
        shell: pwsh
        run: dotnet build tools/portable/HostControlBootstrap/HostControlBootstrap.csproj -c Release
      - name: Build Packaging
        shell: pwsh
        run: dotnet build tools/portable/HostControlPackaging/HostControlPackaging.csproj -c Release
      - name: Contract tests
        shell: pwsh
        run: dotnet run --project tools/portable/HostControlBootstrap.PolicyTests -c Release
      - name: Parse PowerShell 5.1 scripts
        shell: powershell
        run: |
          $files=@('tools/portable/auto-pair-host.ps1','tools/portable/finalize-universal-bundle.ps1','tools/portable/build-universal-host-installer.ps1','tools/portable/test-universal-package-pipeline.ps1')
          foreach($p in $files){$tokens=$null;$errors=$null;[void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors);if($errors.Count){$errors|Format-List;throw "Parse failed: $p"}}
