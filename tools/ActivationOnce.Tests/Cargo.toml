[package]
name = "cloudgime-activation-once-tests"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
anyhow = "1.0.99"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "0.8.2", features = ["v4"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61.2", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
